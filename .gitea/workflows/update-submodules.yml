name: Update Submodules

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-submodules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_TOKEN }}
          submodules: true
          fetch-depth: 0
          persist-credentials: false

      - name: Update submodules
        run: |
          git submodule update --remote --recursive

      - name: Commit and Push Submodule Updates
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No submodule changes detected."
            exit 0
          fi

          git config user.name "Gitea Actions"
          git config user.email "actions@git.rodydavis.dev"

          git config --local --unset-all "http.https://git.rodydavis.dev/.extraheader" || true
          git config --global --unset-all "http.https://git.rodydavis.dev/.extraheader" || true

          TOKEN="${{ secrets.GIT_TOKEN }}"
          [ -z "$TOKEN" ] && TOKEN="${{ secrets.GITHUB_TOKEN }}"
          git remote set-url origin "https://rodydavis:${TOKEN}@git.rodydavis.dev/${{ github.repository }}.git"

          git add -u
          git commit -m "chore: update submodules"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
