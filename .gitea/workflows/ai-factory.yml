name: AI Software Factory

on:
  schedule:
    # Run nightly maintenance sweep at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      task:
        description: 'Factory task to execute'
        required: true
        default: 'sweep'
        type: choice
        options:
          - sweep
          - dependencies
          - pana
          - semver
          - release-prep
          - issue
      package:
        description: 'Target package (e.g. packages/undo or "all")'
        required: false
        default: 'all'
      issue:
        description: 'Optional Gitea Issue Number to resolve'
        required: false
        default: ''

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  maintenance-factory:
    runs-on: [self-hosted, macos]
    env:
      GITEA_TOKEN: ${{ secrets.GITEA_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Environment
        run: |
          echo "Running on host macOS runner: $(uname -a)"
          echo "User: $(whoami)"
          which agy || echo "/Users/rodydavis/.local/bin/agy"
          which duckdb || echo "/opt/homebrew/bin/duckdb"
          which dart || echo "Checking Dart SDK"

      - name: Run Antigravity AI Factory
        run: |
          chmod +x scripts/factory_runner.sh scripts/telemetry.sh scripts/gitea_api.sh .agents/telemetry/emit_otel.sh
          
          TASK="${{ inputs.task || 'sweep' }}"
          PACKAGE="${{ inputs.package || 'all' }}"
          ISSUE="${{ inputs.issue || '' }}"
          
          if [ -n "$ISSUE" ]; then
            ./scripts/factory_runner.sh "$TASK" "$PACKAGE" "30m" --issue "$ISSUE"
          else
            ./scripts/factory_runner.sh "$TASK" "$PACKAGE" "30m"
          fi

      - name: Publish Telemetry Summary
        if: always()
        run: |
          if [ -f scripts/telemetry.sh ]; then
            ./scripts/telemetry.sh markdown-report
          fi
