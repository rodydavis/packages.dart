name: github pages

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-18.04
    steps:
      - uses: actions/checkout@v2

      - name: Set up Flutter
        uses: https://git.rodydavis.dev/rodydavis/shared-actions/setup-flutter@main
        with:
          version: 4ebf37fe7df0a130ba5bee17315b98f905c10b34
          git_token: ${{ secrets.GIT_TOKEN }}

      - name: Install
        run: |
          flutter config --enable-web
          flutter pub get
      - name: Build
        run: cd example && flutter build web --no-sound-null-safety

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./example/build/web
